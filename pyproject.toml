[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dietnetwork"
version = "0.2.0"
description = "PyTorch implementation of DietNetwork for genetic ancestry classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["deep-learning", "genetics", "pytorch", "ancestry-classification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "h5py>=3.8.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "pyplink>=1.3.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
]
interpretability = [
    "captum>=0.6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
tracking = [
    "comet-ml>=3.33.0",
]

[project.scripts]
dietnet = "Dietnet.cli:main"

[project.urls]
Homepage = "https://github.com/rochefca/DIETNETWORK"
Documentation = "https://github.com/rochefca/DIETNETWORK"
Repository = "https://github.com/rochefca/DIETNETWORK"

[tool.hatch.build.targets.wheel]
packages = ["Dietnet"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["Dietnet/tests"]
python_files = ["test_*.py", "*_test.py"]
